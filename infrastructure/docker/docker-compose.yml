# Local development services for the Chicman marketplace.
# Usage (from repository root):
#   cp infrastructure/docker/.env.example infrastructure/docker/.env
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#
# Supabase Auth is a hosted service and is not run here.

name: chicman

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chicman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chicman}
      POSTGRES_DB: ${POSTGRES_DB:-chicman}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-chicman-dev-master-key-change-me}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for product and shop media (SeaweedFS S3 gateway).
  object-storage:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-chicman}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-chicman-dev-secret}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - object-storage-data:/data

  # Background jobs (apps/api/src/workers/): phone-change history retention,
  # once at start and then every 24 hours (spec 04), and the shop logo
  # cleanup and reconciliation job every 5 minutes (spec 06). One instance only: the
  # fixed container_name makes `--scale worker=2` fail, and a PostgreSQL
  # advisory lock makes any other worker process (for example a host-run
  # `pnpm worker`) skip its runs. Logs: `docker compose ... logs -t worker`.
  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: chicman-api:dev
    container_name: chicman-worker
    command: ["pnpm", "--filter", "@chicman/api", "worker"]
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: development
      TZ: UTC
      # The development database of the `postgres` service above, on the Compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-chicman}:${POSTGRES_PASSWORD:-chicman}@postgres:5432/${POSTGRES_DB:-chicman}
      # Object storage of the `object-storage` service, for the logo cleanup job.
      S3_ENDPOINT: http://object-storage:8333
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-chicman}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-chicman-dev-secret}
      S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET:-chicman-uploads}
      S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:-chicman-media}
      # Must equal the API's MEDIA_PUBLIC_BASE_URL (the job matches Shop.logoUrl against it).
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:8333/chicman-media}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      object-storage:
        condition: service_started
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  object-storage-data:
