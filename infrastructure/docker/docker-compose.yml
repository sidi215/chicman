# Local development services for the Chicman marketplace.
# Usage (from repository root):
#   cp infrastructure/docker/.env.example infrastructure/docker/.env
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#
# Supabase Auth is a hosted service and is not run here.

name: chicman

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chicman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chicman}
      POSTGRES_DB: ${POSTGRES_DB:-chicman}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-chicman-dev-master-key-change-me}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for product and shop media (SeaweedFS S3 gateway).
  object-storage:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-chicman}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-chicman-dev-secret}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - object-storage-data:/data

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  object-storage-data:
